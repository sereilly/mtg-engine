name: CI

# The repo's real defenses are its guard scripts — parse coverage with its
# deletion probe, the grammar migration ratchet, CR-citation checking. They only
# help if something runs them, so this workflow is the thing that does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Four shards, each a parallel run (`-n 4 --dist worksteal`) on the runner's
  # four cores, each with its own budget. A shard is a set of tests/ folders
  # and, optionally, a marker expression; tests/engine/test_ci_shards.py fails
  # unless every folder is covered exactly once: by one shard with no markers,
  # or by two whose markers are an expression and its negation (tests/ai is
  # `slow` and `not slow`, so marking a test slow moves it between them).
  test:
    name: test (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: ai-sims
            paths: tests/ai
            markers: slow
            budget: 1860
            baseline: 928
          - shard: ai
            paths: tests/ai
            markers: not slow
            budget: 1420
            baseline: 711
          - shard: engine
            paths: tests/engine
            markers: ''
            budget: 1720
            baseline: 862
          - shard: rest
            paths: tests/sets tests/rules tests/regressions tests/ui
            markers: ''
            budget: 1880
            baseline: 940
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # The time budget. A fast suite is what makes large refactors feasible,
      # so it is defended, not assumed.
      #
      # * BUDGET catches a *step change* (a test that starts a server, an
      #   accidental O(cards^2) sweep), so it sits at ~2x BASELINE rather than
      #   tight against it: a tight budget on a shared runner fails on runner
      #   weather, and a budget that fails on weather gets raised unread.
      # * BASELINE is the shard's own reading from this step's output line on
      #   a runner — never a local timing (the local/runner multiplier has
      #   measured anywhere from 1.0x to 1.9x). The percentage printed on every
      #   run is the creep signal; the 1.5x-BASELINE warning is the alarm.
      # * The runner is drawn per job, and the slow draw (AMD EPYC 7763) takes
      #   about twice the fast one (9V45). Read the CPU on the line before
      #   reading a percentage; baselines are the slower readings so far.
      # * A single run is weather: two runs of one tree have read 2x apart on
      #   one shard. Read several before moving a number.
      # * Raising BUDGET is a decision, taken when a reading presses against
      #   it and recorded in the commit that raises it, with the run id. To
      #   take a reading: `gh workflow run CI --ref <branch>`, then
      #   `gh run view <id> --log | grep "suite wall time"`.
      #
      # The history of every reading and raise (serial 40s in 2026-08 to
      # 17,103s at Planeshift, then the split into shards on 2026-10-20) is in
      # `git log -p .github/workflows/ci.yml`.
      - name: Run the test suite, enforcing the time budget
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_PATHS: ${{ matrix.paths }}
          SHARD_MARKERS: ${{ matrix.markers }}
          BUDGET: ${{ matrix.budget }}
          BASELINE: ${{ matrix.baseline }}
        run: |
          START=$(date +%s)
          STATUS=0
          # SHARD_PATHS is unquoted on purpose: one argument per folder. The
          # marker expression is one argument, and absent when it is empty.
          python -m pytest -n 4 --dist worksteal --durations=15 ${SHARD_MARKERS:+-m "$SHARD_MARKERS"} $SHARD_PATHS || STATUS=$?
          ELAPSED=$(( $(date +%s) - START ))
          # Which machine the job drew, for comparing readings; never fatal.
          CPU=$(grep -m1 "model name" /proc/cpuinfo 2>/dev/null | cut -d: -f2 | sed "s/^ *//") || true
          CPU=${CPU:-an unnamed CPU}
          echo "suite wall time [${SHARD}]: ${ELAPSED}s (baseline ${BASELINE}s, budget ${BUDGET}s — $(( ELAPSED * 100 / BUDGET ))% of budget) on ${CPU}"
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          if [ "$ELAPSED" -gt "$BUDGET" ]; then
            echo "::error::shard ${SHARD} took ${ELAPSED}s, over the ${BUDGET}s budget"
            exit 1
          fi
          if [ "$ELAPSED" -gt $(( BASELINE * 3 / 2 )) ]; then
            echo "::warning::shard ${SHARD} is ${ELAPSED}s against a ${BASELINE}s baseline — creeping toward the ${BUDGET}s budget"
          fi

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Every supported card's oracle text must be claimed by a known consumer,
      # and the deletion probe flags words a matching rule ignored.
      - name: Parse coverage
        run: python scripts/parse_coverage.py --check

      # Parser-migration coverage may only move forward.
      - name: Grammar coverage ratchet
        run: python scripts/grammar_coverage.py --check

      # The same hazard from the other side: the share of the pool supported by
      # writing a card's *name* down may only fall. Ceilings, not floors — a
      # name-keyed entry buys one card, a grammar production buys every card
      # printed the same way, so this is the engine's marginal cost per card.
      - name: Hook reliance ratchet
        run: python scripts/hook_reliance.py --check

      # Every tests/rules/ test cites a Comprehensive Rules rule that exists.
      - name: Rules-citation coverage
        run: python scripts/rules_progress.py --check

      # Behavioural equivalence decides which cards need no separate manual
      # verification, so a signature that stops distinguishing two behaviours
      # silently inflates coverage. New/changed classes must be reviewed.
      - name: Behaviour classes
        run: python scripts/behaviour_classes.py --check

      # The committed vocabulary catalogs the grammar parses against are present.
      - name: Vocabulary catalogs
        run: python scripts/fetch_vocabulary.py --check

      # Regenerating the trackers must be a no-op on a clean tree; a diff here
      # means someone changed behavior without refreshing the generated docs.
      # The five tracker scripts' --check makes that comparison itself, so this
      # step runs only the two generators with no --check of their own:
      # SET_PROGRESS.md (from the cached set_progress.json, no network) and
      # CARD_VERIFICATION.md (a projection of card_verification.json).
      - name: Generated trackers are up to date
        run: |
          python scripts/set_progress.py > /dev/null
          python -c "from web.verification_report import write_verification_markdown as w; w()"
          if ! git diff --quiet; then
            echo "::error::generated trackers are stale — run the scripts and commit the result"
            git --no-pager diff --stat
            exit 1
          fi
