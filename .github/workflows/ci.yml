name: CI

# The repo's real defenses are its guard scripts — parse coverage with its
# deletion probe, the grammar migration ratchet, CR-citation checking. They only
# help if something runs them, so this workflow is the thing that does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # A fast suite is a property worth defending, not an accident: it is what
      # makes the large refactors on the roadmap feasible. The budget catches a
      # *step change* — a test that starts a server, an accidental O(cards^2)
      # sweep — which is why it sits well above the current time rather than
      # tight against it. A tight budget on a shared runner fails on runner
      # weather, and a budget that fails on weather gets raised without anyone
      # reading the number.
      #
      # BASELINE is what the suite actually takes — ~6,845 tests measure at a
      # steady 40s — recorded so the headroom is visible instead of guessed, and
      # printed as a percentage on every run. The gate catches the cliff; the
      # percentage is what shows the creep. That distinction is the lesson from
      # letting it drift 9s -> 17s unnoticed across four phases, with the gate
      # green the whole way.
      #
      # A note on variance, since it nearly caused a wrong conclusion: two
      # back-to-back local runs on one clean tree once measured 43.98s and
      # 16.79s, which read as a runner-weather problem. It did not reproduce —
      # three consecutive runs later landed on 23s exactly. Treat a single slow
      # run as noise and read the printed percentages across several before
      # touching anything.
      #
      # 60 -> 120 (2026-08-21): Runs on Github take significantly longer than local runs
      #
      # 120 -> 240, BASELINE 40 -> 110 (2026-08-28, before the 4ED ingest). The
      # arithmetic never added up because BASELINE was recorded from a *local*
      # run and compared against ELAPSED, which is measured here on the runner —
      # two different machines in one ratio. Reading actual runs settles it:
      # this step took 60s at run 7 (2026-08-20, pre-Legends), 106s at run 11
      # and 112s at run 12 (both 2026-08-27, 9,110 tests). Against the ~82s the
      # same suite measures locally that is a ~1.3x multiplier, not the 2-3x the
      # 120 was sized on — so the multiplier was wrong *and* the budget was
      # tight: 112 of 120 is 93%, and a set ingest adds several hundred tests.
      # BASELINE is now a runner-measured number, so the creep warning compares
      # like with like; BUDGET sits at ~2x it, which is the headroom this gate
      # was always documented to want.
      #
      # BASELINE 110 -> 180 (2026-08-31, after the ICE promotion). Four runner
      # readings at 10,821 tests: 172s, 186s, 163s, 205s. The move is a record
      # of growth, per this gate's own rule — but note the shape: +19% tests
      # took +64% wall time (a local machine measured the same super-linearity,
      # +40%), so the growth is not proportional and per-test cost rose during
      # ICE's waves. The latest run sits at 85% of BUDGET with an ingest ahead;
      # raising BUDGET is a decision, not maintenance, and it has not been
      # taken here. Two ways to avoid having to take it: read `--durations` on
      # a runner run before assuming the ingest forces it, and remember `-m
      # "not slow"` exists if the batch tests are the growth.
      # BUDGET 240 -> 500 and BASELINE 180 -> 260 (2026-09-02, after the
      # Homelands promotion). The fourth budget raise, taken as a decision
      # rather than as maintenance, and **both numbers are runner readings of
      # this tree**: run 33644611682 on branch `homelands` reported
      # `suite wall time: 260s` at 11,923 tests.
      #
      # Why it was due. The last run before the set, 33564882929 on commit
      # 1a294522, read **217s** — already 90% of the old 240. Homelands added
      # ~750 tests on top of that, and 260s against 240 is a gate that fails on
      # arithmetic rather than on a step change.
      #
      # BUDGET is ~2x BASELINE, which is the headroom this gate has always been
      # documented to want, and it is deliberately not another doubling: the
      # 60 -> 120 -> 240 pattern reads as reflexive escalation, and a budget
      # with too much slack stops catching the thing it exists for. A step
      # change — a test that starts a server, an accidental O(cards^2) sweep —
      # is a multiple, not a 10%. At 500 the creep warning (1.5x BASELINE =
      # 390s) sits ~22% below the gate, so the warning can actually fire first,
      # which is the design. An interim 400 was committed before this run and
      # left the two only 10s apart — a warning band that narrow is not a
      # warning.
      #
      # **The method note, which cost a commit to learn.** BASELINE is compared
      # against an ELAPSED the runner measures, so a local timing entering it
      # directly is a missing term rather than an approximation — that is what
      # left these two wrong in opposite directions for three sets. The fix is
      # not to refuse local timings but to make the multiplier measurable: time
      # a commit this workflow has already run, and divide. Doing that here gave
      # 217/126 = 1.72 on commit 1a294522, which projected 138s local to ~237s.
      # **The truth was 260s.** So even a multiplier measured on the immediately
      # preceding commit under-predicted by 10%, because the multiplier itself
      # grows with the suite (1.72 at 11,176 tests, 1.88 at 11,923) — the runner
      # degrades faster than a local machine does. A measured multiplier is
      # good enough to size a *budget*; it is not good enough to set BASELINE,
      # which wants the step's own output. Getting it is one dispatch:
      #   gh workflow run CI --ref <branch>
      #   gh run view <id> --log | grep "suite wall time"
      #
      # One run, not two (2026-09-02). This step used to sit *after* a plain
      # `python -m pytest` step and re-run the whole suite with output discarded,
      # purely to time it — ~260s of duplication on every CI cycle. The
      # correctness run and the timed run are now the same run: ELAPSED is still
      # the serial runner wall time of `python -m pytest`, unchanged in meaning.
      # Two side effects, both deliberate: the timed run now includes first-run
      # .pyc compilation the discarded run used to absorb (a few seconds, well
      # inside the 1.5x warning band), and a red suite exits with pytest's own
      # status before the budget is consulted — a failing suite's duration says
      # nothing about a step change. BASELINE stays 260 until the next runner
      # reading of this step, per the method note above.
      - name: Run the test suite, enforcing the time budget
        env:
          BUDGET: 500
          BASELINE: 260
        run: |
          START=$(date +%s)
          STATUS=0
          python -m pytest || STATUS=$?
          ELAPSED=$(( $(date +%s) - START ))
          echo "suite wall time: ${ELAPSED}s (baseline ${BASELINE}s, budget ${BUDGET}s — $(( ELAPSED * 100 / BUDGET ))% of budget)"
          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi
          if [ "$ELAPSED" -gt "$BUDGET" ]; then
            echo "::error::test suite took ${ELAPSED}s, over the ${BUDGET}s budget"
            exit 1
          fi
          if [ "$ELAPSED" -gt $(( BASELINE * 3 / 2 )) ]; then
            echo "::warning::suite is ${ELAPSED}s against a ${BASELINE}s baseline — creeping toward the ${BUDGET}s budget"
          fi

  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Every supported card's oracle text must be claimed by a known consumer,
      # and the deletion probe flags words a matching rule ignored.
      - name: Parse coverage
        run: python scripts/parse_coverage.py --check

      # Parser-migration coverage may only move forward.
      - name: Grammar coverage ratchet
        run: python scripts/grammar_coverage.py --check

      # The same hazard from the other side: the share of the pool supported by
      # writing a card's *name* down may only fall. Ceilings, not floors — a
      # name-keyed entry buys one card, a grammar production buys every card
      # printed the same way, so this is the engine's marginal cost per card.
      - name: Hook reliance ratchet
        run: python scripts/hook_reliance.py --check

      # Every tests/rules/ test cites a Comprehensive Rules rule that exists.
      - name: Rules-citation coverage
        run: python scripts/rules_progress.py --check

      # Behavioural equivalence decides which cards need no separate manual
      # verification, so a signature that stops distinguishing two behaviours
      # silently inflates coverage. New/changed classes must be reviewed.
      - name: Behaviour classes
        run: python scripts/behaviour_classes.py --check

      # The committed vocabulary catalogs the grammar parses against are present.
      - name: Vocabulary catalogs
        run: python scripts/fetch_vocabulary.py --check

      # Regenerating the trackers must be a no-op on a clean tree; a diff here
      # means someone changed behavior without refreshing the generated docs.
      - name: Generated trackers are up to date
        run: |
          python scripts/grammar_coverage.py > /dev/null
          python scripts/rules_progress.py > /dev/null
          python scripts/behaviour_classes.py > /dev/null
          # PARSE_COVERAGE.md was missing here: its --check guards *unclaimed
          # text*, not report freshness, so a HANDLER_CLAIMS entry could shift
          # the channel table and leave the committed report stale with every
          # guard still green.
          python scripts/parse_coverage.py > /dev/null
          python scripts/hook_reliance.py > /dev/null
          # SET_PROGRESS.md renders from the cached set_progress.json (no
          # network), and CARD_VERIFICATION.md is a projection of
          # card_verification.json — both joined this step after the M21
          # promotion showed their staleness cost: the roadmap read "19
          # untested cards" for a week while the true number was 299.
          python scripts/set_progress.py > /dev/null
          python -c "from web.verification_report import write_verification_markdown as w; w()"
          if ! git diff --quiet; then
            echo "::error::generated trackers are stale — run the scripts and commit the result"
            git --no-pager diff --stat
            exit 1
          fi
