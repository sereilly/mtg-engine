[pytest]
testpaths = tests
addopts = -q
markers =
    full: runs only in the full pass (`pytest --full`, the promotion gate): seeded AI-game batches and whole-pool censuses, 10 s or more each (tests/passes.py)
    cr(*rules): Comprehensive Rules citation(s) the test verifies, e.g. cr("508.1a"); collected by scripts/rules_progress.py
